# =============================================================================
# IMS — Industrial Mill Streaming
# Milling Information Catalog
# =============================================================================
#
# Especificação semântica das informações industriais reconhecidas pelo IMS.
#
# Este arquivo descreve o significado das informações industriais.
# Localizações técnicas, endereços de PLC, protocolos, tópicos Kafka,
# estruturas de banco e parâmetros de aquisição não pertencem a este catálogo.
#
# Principles:
#   - Identity Before Storage
#   - Identity Is Not Location
#   - Meaning Defines Continuity
#   - Observation Is Not Meaning
#   - Context Is a First-Class Entity
#   - KPI Is Derived Information
#
# =============================================================================

catalog:
  name: milling_information_catalog
  domain: milling
  version: "1.0"
  status: baseline

  description: >
    Catálogo semântico das informações industriais reconhecidas pelo
    Industrial Mill Streaming no domínio da Moenda.

# =============================================================================
# PROCESS
# =============================================================================

process:

  logical_name: milling
  display_name: Moenda

  description: >
    Processo industrial responsável pela preparação, alimentação e extração
    mecânica do caldo da cana-de-açúcar, incluindo acionamentos, equipamentos
    auxiliares, embebição e geração de bagaço.

# =============================================================================
# INFORMATION GROUPS
# =============================================================================

information_groups:

  - logical_name: mechanical_load_and_drives
    display_name: Carga Mecânica e Acionamentos

    description: >
      Informações relacionadas ao carregamento mecânico dos equipamentos
      e ao comportamento dos acionamentos da Moenda.

  - logical_name: extraction_process
    display_name: Processo de Extração

    description: >
      Informações relacionadas à alimentação de cana, extração de caldo,
      embebição e condição do bagaço.

  - logical_name: equipment_condition_and_safety
    display_name: Condição dos Equipamentos e Segurança

    description: >
      Informações relacionadas à condição mecânica dos equipamentos,
      sistemas auxiliares, proteção, intertravamentos e segurança operacional.

  - logical_name: operational_state
    display_name: Estado Operacional

    description: >
      Informações que representam os estados, modos e ocorrências associados
      à operação dos equipamentos da Moenda.

  - logical_name: derived_information
    display_name: Informações Derivadas

    description: >
      Informações calculadas ou contextualizadas a partir de evidências
      industriais primárias.

# =============================================================================
# MECHANICAL LOAD & DRIVES
# =============================================================================

