# =============================================================================
# OPERATIONAL STATE
# =============================================================================

  - logical_name: control_mode
    display_name: Modo de Controle
    information_group: operational_state
    information_class: operational_context

    process: milling
    asset: milling_system

    engineering_unit: null
    temporal_behavior: discrete
    source_type: observed
    quality_required: true

    implementation_priority: core

    allowed_values:
      - manual
      - automatic

    description: >
      Modo de controle sob o qual o equipamento ou sistema está operando.

  - logical_name: control_location
    display_name: Local de Controle
    information_group: operational_state
    information_class: operational_context

    process: milling
    asset: milling_system

    engineering_unit: null
    temporal_behavior: discrete
    source_type: observed
    quality_required: true

    implementation_priority: core

    allowed_values:
      - local
      - remote

    description: >
      Origem ou local a partir do qual o controle operacional está sendo
      exercido.

  - logical_name: equipment_state
    display_name: Estado do Equipamento
    information_group: operational_state
    information_class: state

    process: milling
    asset: equipment

    engineering_unit: null
    temporal_behavior: discrete
    source_type: observed
    quality_required: true

    implementation_priority: core

    allowed_values:
      - stopped
      - starting
      - running
      - stopping
      - faulted
      - safety_stopped

    description: >
      Estado operacional normalizado de um equipamento industrial.

  - logical_name: start_count
    display_name: Contador de Partidas
    information_group: operational_state
    information_class: telemetry

    process: milling
    asset: equipment

    engineering_unit: count
    temporal_behavior: counter
    source_type: observed
    quality_required: true

    implementation_priority: enrichment

    description: >
      Contador acumulativo de partidas disponibilizado pelo equipamento
      ou sistema de controle.

  - logical_name: alarm_occurred
    display_name: Ocorrência de Alarme
    information_group: operational_state
    information_class: event

    process: milling
    asset: milling_system

    engineering_unit: null
    temporal_behavior: point_event
    source_type: observed
    quality_required: false

    implementation_priority: core

    description: >
      Ocorrência de alarme proveniente do sistema de automação ou de
      gerenciamento de alarmes existente.

  - logical_name: operational_event
    display_name: Evento Operacional
    information_group: operational_state
    information_class: event

    process: milling
    asset: milling_system

    engineering_unit: null
    temporal_behavior: point_event
    source_type: observed
    quality_required: false

    implementation_priority: enrichment

    description: >
      Ocorrência significativa relacionada à operação do processo
      ou de seus equipamentos.

# =============================================================================
# DERIVED INFORMATION
# =============================================================================

  - logical_name: cane_throughput
    display_name: Taxa de Processamento de Cana
    information_group: derived_information
    information_class: derived_measure

    process: milling
    asset: milling_system

    engineering_unit: t/h
    temporal_behavior: derived
    source_type: derived
    quality_required: true

    implementation_priority: derived

    description: >
      Taxa de processamento de cana calculada a partir das evidências
      industriais disponíveis quando não obtida diretamente como medição.

  - logical_name: imbibition_ratio
    display_name: Relação de Embebição
    information_group: derived_information
    information_class: derived_measure

    process: milling
    asset: imbibition_system

    engineering_unit: null
    temporal_behavior: derived
    source_type: derived
    quality_required: true

    implementation_priority: derived

    description: >
      Relação entre a quantidade de água utilizada na embebição
      e a quantidade de cana processada no período correspondente.

  - logical_name: runtime
    display_name: Tempo de Operação
    information_group: derived_information
    information_class: derived_measure

    process: milling
    asset: equipment

    engineering_unit: h
    temporal_behavior: derived
    source_type: derived
    quality_required: true

    implementation_priority: derived

    description: >
      Tempo efetivo de operação derivado dos estados e transições
      operacionais do equipamento.

  - logical_name: extraction_performance
    display_name: Desempenho de Extração
    information_group: derived_information
    information_class: kpi

    process: milling
    asset: milling_system

    engineering_unit: "%"
    temporal_behavior: derived
    source_type: derived
    quality_required: true

    implementation_priority: derived

    description: >
      Indicador de desempenho associado à eficiência do processo
      de extração. Sua definição matemática deverá ser formalizada
      antes da implementação do cálculo.

  - logical_name: specific_energy_consumption
    display_name: Consumo Específico de Energia
    information_group: derived_information
    information_class: kpi

    process: milling
    asset: milling_system

    engineering_unit: kWh/t
    temporal_behavior: derived
    source_type: derived
    quality_required: true

    implementation_priority: derived

    description: >
      Indicador que relaciona o consumo de energia ao volume de cana
      processado durante um período de referência.

  - logical_name: choking_rate
    display_name: Índice de Embuchamento
    information_group: derived_information
    information_class: kpi

    process: milling
    asset: milling_system

    engineering_unit: events/h
    temporal_behavior: derived
    source_type: derived
    quality_required: true

    implementation_priority: derived

    description: >
      Indicador que relaciona ocorrências de embuchamento ao período
      operacional considerado. Sua definição matemática deverá estabelecer
      explicitamente o período e os eventos considerados.

  - logical_name: operational_availability
    display_name: Disponibilidade Operacional
    information_group: derived_information
    information_class: kpi

    process: milling
    asset: milling_system

    engineering_unit: "%"
    temporal_behavior: derived
    source_type: derived
    quality_required: true

    implementation_priority: derived

    description: >
      Indicador de disponibilidade calculado a partir dos estados
      operacionais e do período de referência. Sua definição deverá
      estabelecer explicitamente os estados, exclusões e tempos considerados.
