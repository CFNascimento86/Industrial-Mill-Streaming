[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "ims-processing-service"
version = "0.1.0"
description = "Continuous event processing service for IMS."
requires-python = ">=3.12"

dependencies = [
    "confluent-kafka==2.16.0",
    "fastavro==1.12.2",
]


[project.optional-dependencies]
test = [
    "pytest>=9.1,<10.0",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "integration: tests that require external infrastructure",
]
